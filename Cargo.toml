[package]
name = "nim-proxy"
version = "0.7.0"
edition = "2021"
description = "Rate-limit-aware OpenAI-compatible proxy for NVIDIA NIM with multi-key load balancing"
license = "MIT"
repository = "https://github.com/miztertea/nim-proxy"
homepage = "https://github.com/miztertea/nim-proxy"
readme = "README.md"
# Measured with `cargo msrv find` and verified with --all-targets; CI's
# `msrv` job builds with exactly this toolchain so the claim can't rot.
rust-version = "1.87"
keywords = ["proxy", "openai", "rate-limiting", "nvidia", "llm"]
categories = ["network-programming", "web-programming::http-server"]

# `--cfg fuzzing` is set by cargo-fuzz for the whole build graph; teach the
# unexpected_cfgs lint about it so -D warnings stays clean in normal builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde_json = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"

# PBKDF2 password hashing ran 600k HMAC-SHA256 iterations — removed with the
# dashboard. These overrides kept dev-build hashing fast; retained (harmless,
# tiny) for any future crypto on the hot paths.
[profile.dev]
opt-level = 1

[profile.release]
lto = true
strip = true
# Optimize for speed (the proxy's job): re-enables inlining/vectorization on the
# JSON-parse and SSE-scan hot paths. lto + strip + codegen-units=1 keep the size
# growth modest against opt-level="z".
opt-level = 3
codegen-units = 1
